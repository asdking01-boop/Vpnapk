name: Deploy Cloudflare Worker

on:
  push:
    paths:
      - 'backend-tmdb-proxy/**'
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Security & Unit Tests
        working-directory: backend-tmdb-proxy
        run: |
          node --test worker.test.js

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'backend-tmdb-proxy'
          # Note: wrangler.toml already defines the D1 database binding 'DB'.
          # Do not pass duplicate --d1 flags or append duplicate [[d1_databases]] blocks.
