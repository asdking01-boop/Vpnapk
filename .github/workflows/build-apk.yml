name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          else
            gradle assembleDebug --console=plain 2>&1 | tee build.log
          fi

      - name: Show errors
        if: failure()
        run: |
          echo "## Build errors" >> $GITHUB_STEP_SUMMARY
          grep -n -E "^e: |error:|What went wrong|FAILURE|Execution failed|Could not|not found" -A3 build.log | head -60 >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KrasTV-apk
          path: app/build/outputs/apk/debug/*.apk