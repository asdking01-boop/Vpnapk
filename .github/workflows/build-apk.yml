name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore signing key (keeps the same signature between builds)
        id: keycache
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: kras-debug-keystore-v1

      - name: Create debug keystore (only if missing)
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --console=plain \
              -PversionCode=${{ github.run_number }} \
              -PversionName=1.0.${{ github.run_number }} 2>&1 | tee build.log
          else
            gradle assembleDebug --console=plain \
              -PversionCode=${{ github.run_number }} \
              -PversionName=1.0.${{ github.run_number }} 2>&1 | tee build.log
          fi

      - name: Show errors
        if: failure()
        run: |
          echo "## Build errors" >> $GITHUB_STEP_SUMMARY
          grep -n -E "^e: |What went wrong|FAILURE|Execution failed|Could not|not found" -A3 build.log | head -60 >> $GITHUB_STEP_SUMMARY

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/*.apk KrasTV.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KrasTV-apk
          path: KrasTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kras TV ${{ github.run_number }}
          body: "Build ${{ github.run_number }}: ${{ github.event.head_commit.message }}"
          files: KrasTV.apk