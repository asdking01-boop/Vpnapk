name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --console=plain 2>&1 | tee build.log
          else
            gradle assembleDebug --console=plain 2>&1 | tee build.log
          fi

      - name: Show errors
        if: failure()
        run: |
          echo "## Build errors" >> $GITHUB_STEP_SUMMARY
          grep -n -E "^e: |What went wrong|FAILURE|Execution failed|Could not|not found|password" -A3 build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo "## Signing config" >> $GITHUB_STEP_SUMMARY
          grep -n -i -B2 -A8 "signingConfigs" app/build.gradle.kts | head -30 >> $GITHUB_STEP_SUMMARY || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KrasTV-apk
          path: app/build/outputs/apk/debug/*.apk