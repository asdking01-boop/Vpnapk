name = "kras-tmdb-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

# Required Secret (already configured in your Cloudflare Worker):
#   npx wrangler secret put TMDB_API_KEY
#
# Optional Storage Binding Option A — Cloudflare D1 Database:
#   Note: If bound as "DB", the Worker automatically creates all required tables on first request.
# [[d1_databases]]
# binding = "DB"
# database_name = "kras-tmdb-db"
# database_id = "<your-d1-database-id>"
#
# Optional Storage Binding Option B — Cloudflare KV Namespace:
# [[kv_namespaces]]
# binding = "TMDB_AUTH_KV"
# id = "<your-kv-namespace-id>"
